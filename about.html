<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>من نحن | QR Pro Tools</title><link rel="stylesheet" href="assets/style.css"></head><body><header><nav><a class="brand" href="index.html">QR Pro Tools</a><div class="actions"><button class="iconbtn" onclick="document.body.classList.toggle('dark')">◐</button><button class="btn" id="lang" onclick="toggleLang()">English</button></div></nav></header><main><article class="card content"><h1 data-i18n="title">من نحن</h1><p data-i18n="body">QR Pro Tools منصة ويب بسيطة وسريعة لإنشاء رموز QR واستخدام أدوات مرتبطة بها مباشرة من المتصفح. نركز على سهولة الاستخدام والخصوصية وعدم الحاجة إلى إنشاء حساب.</p><p>تم تصميم الأدوات لتعمل على الهاتف والكمبيوتر، مع دعم العربية والإنجليزية.</p></article></main><footer>© <span id="year"></span> QR Pro Tools</footer><script>const x={ar:{title:'من نحن',body:'QR Pro Tools منصة ويب بسيطة وسريعة لإنشاء رموز QR واستخدام أدوات مرتبطة بها مباشرة من المتصفح.'},en:{title:'About Us',body:'QR Pro Tools is a simple and fast web platform for creating QR codes and using related tools directly in your browser.'}};let l=localStorage.getItem('qr-lang')||'ar';function setLang(v){l=v==='en'?'en':'ar';document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.querySelector('[data-i18n="title"]').textContent=x[l].title;document.querySelector('[data-i18n="body"]').textContent=x[l].body;document.getElementById('lang').textContent=l==='ar'?'English':'العربية';localStorage.setItem('qr-lang',l)}function toggleLang(){setLang(l==='ar'?'en':'ar')}setLang(l);document.getElementById('year').textContent=new Date().getFullYear()</script></body></html>
