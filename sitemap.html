=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.querySelector('[data-i18n="title"]').textContent=q[l].title;document.querySelector('[data-i18n="body"]').textContent=q[l].body;document.getElementById('lang').textContent=l==='ar'?'English':'العربية';localStorage.setItem('qr-lang',l)}function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'☀':'◐'}(function(){if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');const l=localStorage.getItem('qr-lang')||'ar';document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.querySelector('[data-i18n="title"]').textContent=q[l].title;document.querySelector('[data-i18n="body"]').textContent=q[l].body;document.getElementById('lang').textContent=l==='ar'?'English':'العربية';document.getElementById('year').textContent=new Date().getFullYear();document.getElementById('theme').textContent=document.body.classList.contains('dark')?'☀':'◐'})();</script></body></html>
